<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SEARA - Stock Check</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glassmorphism { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- ==================== AUTH VIEW (หน้าล็อกอิน) ==================== -->
  <div id="authView" class="min-h-screen flex items-center justify-center p-4 bg-slate-50">
    <div class="bg-white border border-slate-200/90 rounded-[32px] shadow-2xl p-7 md:p-9 w-full max-w-sm space-y-6">
      <div class="text-center space-y-2">
        <div class="flex justify-center mb-1">
          <img src="./logo.png" alt="SEARA" class="h-14 w-auto object-contain">
        </div>
        <h2 id="authTitle" class="text-xl font-extrabold text-slate-900 tracking-tight">Sign In</h2>
        <p id="authSubtitle" class="text-[12px] text-slate-400 font-medium">Enter your work email to continue</p>
      </div>

      <!-- Step 1: Email Form -->
      <form id="emailForm" onsubmit="handleEmailSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Work Email</label>
          <input type="email" id="emailInput" required placeholder="name@searasports.com" 
                 class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 text-[14px] font-medium focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition">
        </div>
        <button type="submit" id="emailSubmitBtn" 
                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white rounded-2xl font-bold text-[14px] shadow-lg shadow-indigo-600/25 transition">
          Next →
        </button>
      </form>

      <!-- Step 2: PIN Form -->
      <form id="pinForm" onsubmit="handlePinSubmit(event)" class="space-y-4 hidden">
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label id="pinLabel" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider">Security PIN</label>
            <span id="userEmailBadge" class="text-[11px] text-indigo-600 font-semibold truncate max-w-[170px]"></span>
          </div>
          <input type="password" id="pinInput" maxlength="6" inputmode="numeric" required placeholder="••••" 
                 class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 text-center text-[22px] tracking-widest font-mono font-bold focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
        </div>
        <button type="submit" id="pinSubmitBtn" 
                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white rounded-2xl font-bold text-[14px] shadow-lg shadow-indigo-600/25 transition">
          Sign In
        </button>
        <button type="button" onclick="backToEmail()" class="w-full text-center text-[12px] text-slate-400 font-bold hover:text-slate-600 py-1">
          ← Switch Account
        </button>
      </form>

      <!-- Status Message -->
      <div id="authStatus" class="hidden rounded-2xl p-3.5 text-center text-[12px] font-semibold"></div>
    </div>
  </div>

  <!-- ==================== MAIN APP VIEW (เวอร์ชันออกแบบใหม่ล่าสุด) ==================== -->
  <div id="mainView" class="hidden pb-20">
    
    <!-- Top Bar Sticky Header -->
    <header class="glassmorphism sticky top-0 z-40 border-b border-slate-200/80">
      <div class="max-w-4xl mx-auto px-4 py-3">
        <div class="flex justify-between items-center mb-2.5">
          <div class="flex items-center space-x-3">
            <img src="./logo.png" alt="SEARA" class="h-8 w-auto object-contain">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-[15px] font-extrabold text-slate-900 tracking-tight leading-none">Inventory</span>
                <span id="userEmailTag" class="text-[10px] font-bold px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-full truncate max-w-[150px]"></span>
              </div>
              <p id="syncTimeText" class="text-[10px] text-slate-400 font-semibold mt-1">Sync: -</p>
            </div>
          </div>
          <div class="flex items-center space-x-1.5">
            <button onclick="fetchStockData(true)" title="Sync Data" 
                    class="p-2.5 text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 active:scale-95 rounded-2xl transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
            <button onclick="handleSignOut()" title="Sign Out" 
                    class="p-2.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 active:scale-95 rounded-2xl transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
          </div>
        </div>

        <!-- Search Input -->
        <div class="relative">
          <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Search Item No, Description, Brand..." 
                 class="w-full pl-10 pr-9 py-2.5 bg-slate-100/80 border border-slate-200/80 rounded-2xl text-[13px] font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white transition">
          <span class="absolute left-3.5 top-2.5 text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </span>
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-2 text-slate-400 hover:text-slate-600 text-sm p-1">✕</button>
        </div>

        <!-- Horizontal Scrollable Filters -->
        <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar pt-2.5">
          <select id="warehouseFilter" onchange="filterAndRender()" 
                  class="bg-white border border-slate-200 text-[11px] font-bold text-slate-700 px-3 py-1.5 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 shrink-0">
            <option value="ALL">All Warehouses</option>
          </select>
          <select id="brandFilter" onchange="filterAndRender()" 
                  class="bg-white border border-slate-200 text-[11px] font-bold text-slate-700 px-3 py-1.5 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 shrink-0">
            <option value="ALL">All Brands</option>
          </select>
          <select id="statusFilter" onchange="filterAndRender()" 
                  class="bg-white border border-slate-200 text-[11px] font-bold text-slate-700 px-3 py-1.5 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 shrink-0">
            <option value="ALL">All Status</option>
            <option value="In Stock">In Stock (>0)</option>
            <option value="Ordered">Ordered (PO)</option>
            <option value="Out of Stock">Out of Stock</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto p-4 space-y-3">
      
      <!-- Counter & Status Summary -->
      <div class="flex justify-between items-center px-1">
        <span id="resultCount" class="text-[12px] font-bold text-slate-500">Showing 0 items</span>
      </div>

      <!-- Loading Placeholder -->
      <div id="loadingIndicator" class="text-center py-20 space-y-3">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
        <p class="text-[13px] font-bold text-slate-500">Loading stock data...</p>
      </div>

      <!-- Stock Cards Container -->
      <div id="itemsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-20 space-y-3">
        <div class="text-5xl">📦</div>
        <p class="text-[15px] font-extrabold text-slate-800">No matching items found</p>
        <p class="text-[12px] text-slate-400">Try adjusting your keyword or warehouse filter</p>
      </div>

    </main>
  </div>

  <!-- Detail Bottom Modal -->
  <div id="detailModal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/50 backdrop-blur-sm transition-opacity">
    <div class="bg-white rounded-t-[32px] sm:rounded-[32px] max-w-lg w-full p-6 space-y-5 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute right-5 top-5 text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-100">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const DATA_URL = "./data.json";
    
    // ดึง URL Web App ที่เชื่อมต่อไว้ตรงกับ Google Apps Script ของคุณ
    let AUTH_API_URL = "https://script.google.com/macros/s/AKfycbyx0pU_b-gq7W0p5fW7j68m5Wv7n6X2v1y3/exec"; 
    
    // พยายามดึง URL ล่าสุดจาก LocalStorage หากเคยมีบันทึกไว้
    const savedApiUrl = localStorage.getItem('seara_auth_api_url');
    if (savedApiUrl) AUTH_API_URL = savedApiUrl;

    let allItems = [];
    let currentAuthMode = 'login';
    let pendingEmail = '';

    window.onload = () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error', err));
      }

      const activeUser = localStorage.getItem('seara_user_email');
      if (activeUser) {
        showApp(activeUser);
      } else {
        showAuth();
      }
    };

    function showAuth() {
      document.getElementById('authView').classList.remove('hidden');
      document.getElementById('mainView').classList.add('hidden');
    }

    function showApp(email) {
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('mainView').classList.remove('hidden');
      document.getElementById('userEmailTag').innerText = email || localStorage.getItem('seara_user_email');
      fetchStockData();
    }

    function showAuthError(msg) {
      const status = document.getElementById('authStatus');
      status.className = 'rounded-2xl p-3.5 text-center text-[12px] font-semibold bg-rose-50 text-rose-700 border border-rose-200';
      status.innerText = msg;
      status.classList.remove('hidden');
    }

    async function handleEmailSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const btn = document.getElementById('emailSubmitBtn');
      
      btn.disabled = true;
      btn.innerText = 'Checking...';
      document.getElementById('authStatus').classList.add('hidden');

      try {
        const res = await fetch(`${AUTH_API_URL}?action=checkEmail&email=${encodeURIComponent(email)}`);
        const data = await res.json();

        if (data.success) {
          pendingEmail = email;
          document.getElementById('emailForm').classList.add('hidden');
          document.getElementById('pinForm').classList.remove('hidden');
          document.getElementById('userEmailBadge').innerText = email;

          if (data.hasPin) {
            currentAuthMode = 'login';
            document.getElementById('authTitle').innerText = 'Security PIN';
            document.getElementById('authSubtitle').innerText = 'Enter your 4-6 digit PIN';
            document.getElementById('pinLabel').innerText = 'ENTER PIN';
            document.getElementById('pinSubmitBtn').innerText = 'Sign In';
          } else {
            currentAuthMode = 'setup';
            document.getElementById('authTitle').innerText = 'Create PIN';
            document.getElementById('authSubtitle').innerText = 'Set a 4-6 digit PIN for first-time login';
            document.getElementById('pinLabel').innerText = 'CREATE NEW PIN';
            document.getElementById('pinSubmitBtn').innerText = 'Save & Sign In';
          }
          document.getElementById('pinInput').focus();
        } else {
          showAuthError(data.message || 'Email not authorized to access system.');
        }
      } catch (err) {
        showAuthError('Connection error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Next →';
      }
    }

    async function handlePinSubmit(e) {
      e.preventDefault();
      const pin = document.getElementById('pinInput').value.trim();
      const btn = document.getElementById('pinSubmitBtn');

      if (pin.length < 4) {
        showAuthError('PIN must be at least 4 digits');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Verifying...';
      document.getElementById('authStatus').classList.add('hidden');

      try {
        const action = currentAuthMode === 'setup' ? 'setupPin' : 'auth';
        const res = await fetch(`${AUTH_API_URL}?action=${action}&email=${encodeURIComponent(pendingEmail)}&pin=${encodeURIComponent(pin)}`);
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('seara_user_email', pendingEmail);
          showApp(pendingEmail);
        } else {
          showAuthError(data.message || 'Invalid PIN. Please try again.');
        }
      } catch (err) {
        showAuthError('Connection error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.innerText = currentAuthMode === 'setup' ? 'Save & Sign In' : 'Sign In';
      }
    }

    function backToEmail() {
      document.getElementById('pinForm').classList.add('hidden');
      document.getElementById('emailForm').classList.remove('hidden');
      document.getElementById('authTitle').innerText = 'Sign In';
      document.getElementById('authSubtitle').innerText = 'Enter your work email to continue';
      document.getElementById('authStatus').classList.add('hidden');
      document.getElementById('pinInput').value = '';
    }

    function handleSignOut() {
      if (confirm('Are you sure you want to sign out?')) {
        localStorage.removeItem('seara_user_email');
        location.reload();
      }
    }

    // ==========================================
    // DATA FETCHING & FILTERING
    // ==========================================
    async function fetchStockData(forceRefresh = false) {
      const loader = document.getElementById('loadingIndicator');
      loader.classList.remove('hidden');

      try {
        const fetchUrl = forceRefresh ? `${DATA_URL}?t=${new Date().getTime()}` : `${DATA_URL}?t=${Math.floor(Date.now() / 60000)}`;
        const res = await fetch(fetchUrl);
        if (!res.ok) throw new Error('Failed to load data.json');

        const json = await res.json();
        allItems = json.items || [];
        document.getElementById('syncTimeText').innerText = `Sync: ${json.syncTime || '-'}`;

        populateFilterOptions();
        filterAndRender();
      } catch (err) {
        console.error(err);
      } finally {
        loader.classList.add('hidden');
      }
    }

    function populateFilterOptions() {
      const warehouses = new Set();
      const brands = new Set();

      allItems.forEach(item => {
        if (item.wh) warehouses.add(item.wh);
        if (item.brand) brands.add(item.brand);
      });

      const whSelect = document.getElementById('warehouseFilter');
      whSelect.innerHTML = '<option value="ALL">All Warehouses</option>';
      Array.from(warehouses).sort().forEach(wh => {
        whSelect.innerHTML += `<option value="${wh}">${wh}</option>`;
      });

      const brandSelect = document.getElementById('brandFilter');
      brandSelect.innerHTML = '<option value="ALL">All Brands</option>';
      Array.from(brands).sort().forEach(b => {
        brandSelect.innerHTML += `<option value="${b}">${b}</option>`;
      });
    }

    function filterAndRender() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const selWh = document.getElementById('warehouseFilter').value;
      const selBrand = document.getElementById('brandFilter').value;
      const selStatus = document.getElementById('statusFilter').value;

      const filtered = allItems.filter(item => {
        const matchesSearch = !search || 
          item.itemNo.toLowerCase().includes(search) || 
          item.desc.toLowerCase().includes(search) || 
          item.brand.toLowerCase().includes(search);

        const matchesWh = selWh === 'ALL' || item.wh === selWh;
        const matchesBrand = selBrand === 'ALL' || item.brand === selBrand;
        const matchesStatus = selStatus === 'ALL' || item.statusText === selStatus;

        return matchesSearch && matchesWh && matchesBrand && matchesStatus;
      });

      renderItems(filtered);
    }

    function renderItems(items) {
      const container = document.getElementById('itemsContainer');
      const empty = document.getElementById('emptyState');
      const count = document.getElementById('resultCount');

      container.innerHTML = '';
      count.innerText = `Showing ${items.length.toLocaleString()} items`;

      if (items.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      const displayItems = items.slice(0, 200);

      displayItems.forEach((item) => {
        let badgeBg = 'bg-rose-50 text-rose-700 border-rose-200';
        if (item.color === 'green') badgeBg = 'bg-emerald-50 text-emerald-700 border-emerald-200';
        else if (item.color === 'yellow') badgeBg = 'bg-amber-50 text-amber-700 border-amber-200';

        const card = document.createElement('div');
        card.className = 'bg-white border border-slate-200/90 rounded-[22px] p-4 shadow-sm hover:shadow-md transition active:scale-[0.99] cursor-pointer flex flex-col justify-between';
        card.onclick = () => openModal(item);
        
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start gap-2">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-[10px] font-black uppercase px-2 py-0.5 bg-slate-100 text-slate-700 rounded-md tracking-wider">${escapeHtml(item.wh)}</span>
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-tight">${escapeHtml(item.brand)}</span>
              </div>
              <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full border ${badgeBg} shrink-0">
                ${escapeHtml(item.statusText)}
              </span>
            </div>
            <h3 class="text-[15px] font-extrabold text-slate-900 mt-2 tracking-tight">${escapeHtml(item.itemNo)}</h3>
            <p class="text-[12px] text-slate-500 font-medium line-clamp-2 mt-1 leading-snug">${escapeHtml(item.desc)}</p>
          </div>

          <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-slate-100 text-center">
            <div class="bg-emerald-50/50 rounded-xl py-1.5 border border-emerald-100/50">
              <p class="text-[9px] font-extrabold text-emerald-700 uppercase">Available</p>
              <p class="text-[15px] font-black text-emerald-600">${item.availableInStock.toLocaleString()}</p>
            </div>
            <div class="bg-slate-50 rounded-xl py-1.5 border border-slate-100">
              <p class="text-[9px] font-extrabold text-slate-400 uppercase">In Stock</p>
              <p class="text-[15px] font-black text-slate-700">${item.inStock.toLocaleString()}</p>
            </div>
            <div class="bg-amber-50/50 rounded-xl py-1.5 border border-amber-100/50">
              <p class="text-[9px] font-extrabold text-amber-700 uppercase">Ordered</p>
              <p class="text-[15px] font-black text-amber-600">${item.ordered.toLocaleString()}</p>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function handleSearch(val) {
      const clearBtn = document.getElementById('clearSearchBtn');
      if (val.trim()) clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');
      filterAndRender();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      filterAndRender();
      input.focus();
    }

    function openModal(item) {
      const content = document.getElementById('modalContent');
      content.innerHTML = `
        <div class="space-y-4">
          <div>
            <div class="flex items-center gap-2 mb-1.5">
              <span class="text-[10px] font-black uppercase px-2 py-0.5 bg-slate-100 text-slate-700 rounded-md tracking-wider">${escapeHtml(item.wh)}</span>
              <span class="text-[11px] font-bold text-slate-400 uppercase tracking-tight">${escapeHtml(item.brand)}</span>
            </div>
            <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">${escapeHtml(item.itemNo)}</h2>
            <p class="text-[13px] text-slate-600 font-medium mt-1">${escapeHtml(item.desc)}</p>
          </div>

          <div class="grid grid-cols-2 gap-2.5 bg-slate-50 p-4 rounded-2xl border border-slate-100">
            <div class="bg-white p-3 rounded-xl border border-slate-200/60 shadow-sm">
              <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Available (พร้อมขาย)</p>
              <p class="text-2xl font-black text-emerald-600 mt-0.5">${item.availableInStock.toLocaleString()} <span class="text-[11px] font-bold text-slate-400">${escapeHtml(item.unit)}</span></p>
            </div>
            <div class="bg-white p-3 rounded-xl border border-slate-200/60 shadow-sm">
              <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">In Stock (ในคลัง)</p>
              <p class="text-2xl font-black text-slate-800 mt-0.5">${item.inStock.toLocaleString()} <span class="text-[11px] font-bold text-slate-400">${escapeHtml(item.unit)}</span></p>
            </div>
            <div class="bg-white p-3 rounded-xl border border-slate-200/60 shadow-sm">
              <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Committed (จอง)</p>
              <p class="text-xl font-extrabold text-rose-500 mt-0.5">${item.defined.toLocaleString()} <span class="text-[11px] font-bold text-slate-400">${escapeHtml(item.unit)}</span></p>
            </div>
            <div class="bg-white p-3 rounded-xl border border-slate-200/60 shadow-sm">
              <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">On Order (รอเข้า)</p>
              <p class="text-xl font-extrabold text-amber-500 mt-0.5">${item.ordered.toLocaleString()} <span class="text-[11px] font-bold text-slate-400">${escapeHtml(item.unit)}</span></p>
            </div>
          </div>
        </div>
      `;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
