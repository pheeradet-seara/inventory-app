<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SEARA - Inventory Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4338ca">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glassmorphism { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .bottom-sheet { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  </style>
</head>
<body class="bg-slate-100/70 text-slate-800 min-h-screen antialiased select-none">

  <!-- ==================== AUTH VIEW (หน้าล็อกอิน) ==================== -->
  <div id="authView" class="min-h-screen flex items-center justify-center p-4 bg-slate-50">
    <div class="bg-white border border-slate-200/90 rounded-[32px] shadow-2xl p-7 md:p-9 w-full max-w-sm space-y-6">
      <div class="text-center space-y-2">
        <div class="flex justify-center mb-1">
          <img src="./logo.png" alt="SEARA" class="h-14 w-auto object-contain">
        </div>
        <h2 id="authTitle" class="text-xl font-extrabold text-slate-900 tracking-tight">Sign In</h2>
        <p id="authSubtitle" class="text-[12px] text-slate-400 font-medium">Enter your work email to continue</p>
      </div>

      <!-- Step 1: Email Form -->
      <form id="emailForm" onsubmit="handleEmailSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Work Email</label>
          <input type="email" id="emailInput" required placeholder="name@searasports.com" 
                 class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 text-[14px] font-semibold text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
        </div>
        <button type="submit" id="emailSubmitBtn" 
                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white rounded-2xl font-bold text-[14px] shadow-lg shadow-indigo-600/30 transition">
          Next →
        </button>
      </form>

      <!-- Step 2: PIN Form -->
      <form id="pinForm" onsubmit="handlePinSubmit(event)" class="space-y-4 hidden">
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label id="pinLabel" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider">Security PIN</label>
            <span id="userEmailBadge" class="text-[11px] text-indigo-600 font-semibold truncate max-w-[170px]"></span>
          </div>
          <input type="password" id="pinInput" maxlength="6" inputmode="numeric" required placeholder="••••" 
                 class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 text-center text-[24px] tracking-widest font-mono font-bold focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
        </div>
        <button type="submit" id="pinSubmitBtn" 
                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white rounded-2xl font-bold text-[14px] shadow-lg shadow-indigo-600/30 transition">
          Sign In
        </button>
        <button type="button" onclick="backToEmail()" class="w-full text-center text-[12px] text-slate-400 font-bold hover:text-slate-600 py-1">
          ← Switch Account
        </button>
      </form>

      <div id="authStatus" class="hidden rounded-2xl p-3.5 text-center text-[12px] font-semibold"></div>
    </div>
  </div>

  <!-- ==================== MAIN VIEW (เวอร์ชันเต็มรูปแบบ) ==================== -->
  <div id="mainView" class="hidden pb-24">
    
    <!-- Top Sticky Header -->
    <header class="glassmorphism sticky top-0 z-40 border-b border-slate-200/90 shadow-sm">
      <div class="max-w-4xl mx-auto px-4 pt-3.5 pb-3 space-y-3">
        
        <!-- Brand & User Profile Row -->
        <div class="flex justify-between items-center">
          <div class="flex items-center space-x-3">
            <img src="./logo.png" alt="SEARA" class="h-9 w-auto object-contain">
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-[16px] font-black text-slate-900 tracking-tight leading-none">Stock Check</span>
                <span id="userRoleBadge" class="text-[9px] font-black uppercase px-2 py-0.5 bg-indigo-50 text-indigo-700 rounded-full border border-indigo-100">User</span>
              </div>
              <p id="syncTimeText" class="text-[10px] text-slate-400 font-semibold mt-1">Sync: -</p>
            </div>
          </div>
          
          <div class="flex items-center space-x-2">
            <button onclick="fetchStockData(true)" title="Force Refresh" 
                    class="p-2.5 bg-white border border-slate-200 text-slate-600 hover:text-indigo-600 active:scale-95 rounded-2xl shadow-sm transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
            <button onclick="handleSignOut()" title="Sign Out" 
                    class="p-2.5 bg-white border border-slate-200 text-slate-400 hover:text-rose-600 active:scale-95 rounded-2xl shadow-sm transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
          </div>
        </div>

        <!-- Search Bar with Live Clear -->
        <div class="relative">
          <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="ค้นหารหัสสินค้า, ชื่อสินค้า, แบรนด์..." 
                 class="w-full pl-11 pr-10 py-3 bg-white border border-slate-200/90 rounded-2xl text-[13px] font-semibold text-slate-800 placeholder-slate-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition">
          <span class="absolute left-4 top-3.5 text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          </span>
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3.5 top-3 text-slate-400 hover:text-slate-600 p-1 text-sm font-bold">✕</button>
        </div>

        <!-- Horizontal Filter Pills -->
        <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar pt-0.5">
          <select id="warehouseFilter" onchange="filterAndRender()" 
                  class="bg-white border border-slate-200 text-[11px] font-bold text-slate-700 px-3 py-1.5 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 shrink-0 shadow-sm">
            <option value="ALL">ทุกคลัง (All Warehouses)</option>
          </select>
          <select id="brandFilter" onchange="filterAndRender()" 
                  class="bg-white border border-slate-200 text-[11px] font-bold text-slate-700 px-3 py-1.5 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 shrink-0 shadow-sm">
            <option value="ALL">ทุกแบรนด์ (All Brands)</option>
          </select>
          <select id="statusFilter" onchange="filterAndRender()" 
                  class="bg-white border border-slate-200 text-[11px] font-bold text-slate-700 px-3 py-1.5 rounded-xl outline-none focus:ring-2 focus:ring-indigo-600 shrink-0 shadow-sm">
            <option value="ALL">สถานะทั้งหมด</option>
            <option value="In Stock">พร้อมขาย (>0)</option>
            <option value="Ordered">สั่งซื้อแล้ว (PO)</option>
            <option value="Out of Stock">หมด (Out of Stock)</option>
          </select>
        </div>

      </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4 pt-4 space-y-4">

      <!-- Summary KPI Metric Cards -->
      <div class="grid grid-cols-3 gap-2.5">
        <div class="bg-white border border-slate-200/90 rounded-2xl p-3 shadow-sm text-center">
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">รายการสินค้า</p>
          <p id="kpiTotal" class="text-lg font-black text-slate-800 mt-0.5">-</p>
        </div>
        <div class="bg-emerald-50/70 border border-emerald-100 rounded-2xl p-3 shadow-sm text-center">
          <p class="text-[10px] font-bold text-emerald-700 uppercase tracking-wider">พร้อมจำหน่าย</p>
          <p id="kpiInStock" class="text-lg font-black text-emerald-600 mt-0.5">-</p>
        </div>
        <div class="bg-amber-50/70 border border-amber-100 rounded-2xl p-3 shadow-sm text-center">
          <p class="text-[10px] font-bold text-amber-700 uppercase tracking-wider">รอสินค้าเข้า (PO)</p>
          <p id="kpiOrdered" class="text-lg font-black text-amber-600 mt-0.5">-</p>
        </div>
      </div>

      <!-- Quick Suggestion Badges (แสดงเมื่อค้นหาไม่เจอหรือหน้าแรก) -->
      <div id="quickSuggestBox" class="space-y-1.5">
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider px-1">แบรนด์ยอดนิยม</p>
        <div id="quickBrandBadges" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>
      </div>

      <!-- List Count Header -->
      <div class="flex justify-between items-center px-1">
        <span id="resultCount" class="text-[12px] font-bold text-slate-500">กำลังโหลด...</span>
        <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">แตะที่การ์ดเพื่อดูสต็อกเต็ม</span>
      </div>

      <!-- Loading State -->
      <div id="loadingIndicator" class="text-center py-24 space-y-3">
        <div class="inline-block animate-spin rounded-full h-9 w-9 border-4 border-indigo-600 border-t-transparent"></div>
        <p class="text-[13px] font-bold text-slate-500">กำลังโหลดฐานข้อมูลสต็อกล่าสุด...</p>
      </div>

      <!-- Inventory Items Grid -->
      <div id="itemsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-20 space-y-3 bg-white rounded-3xl border border-slate-200/90 p-8">
        <div class="text-5xl">📦</div>
        <p class="text-[15px] font-extrabold text-slate-800">ไม่พบรายการที่ตรงกับคำค้นหา</p>
        <p class="text-[12px] text-slate-400">ลองล้างตัวกรองหรือพิมพ์คำค้นหาใหม่อีกครั้ง</p>
        <button onclick="clearSearch()" class="px-4 py-2 bg-indigo-50 text-indigo-700 font-bold text-[12px] rounded-xl hover:bg-indigo-100 transition">
          ล้างคำค้นหาทั้งหมด
        </button>
      </div>

    </main>
  </div>

  <!-- ==================== BOTTOM SHEET MODAL DETAIL ==================== -->
  <div id="detailModal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm">
    <div id="modalSheet" class="bottom-sheet bg-white rounded-t-[32px] sm:rounded-[32px] max-w-lg w-full p-6 space-y-5 shadow-2xl relative max-h-[88vh] overflow-y-auto">
      
      <!-- Close Button -->
      <button onclick="closeModal()" class="absolute right-5 top-5 text-slate-400 hover:text-slate-600 p-2 rounded-full hover:bg-slate-100 transition">✕</button>
      
      <div id="modalContent"></div>
      
      <button onclick="closeModal()" class="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-[13px] rounded-2xl transition">
        ปิดหน้าต่าง
      </button>
    </div>
  </div>

  <script>
    const DATA_URL = "./data.json";
    const AUTH_API_URL = "https://script.google.com/macros/s/AKfycbwfQ1z41ldFapHtjkgjWjzf2k4MPhORVu0yhnF3QWQJ4dgjtToPnoNHtccmBjVR405O_w/exec"; 

    let allItems = [];
    let currentAuthMode = 'login';
    let pendingEmail = '';

    window.onload = () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error', err));
      }

      const activeUser = localStorage.getItem('seara_user_email');
      if (activeUser) {
        showApp(activeUser);
      } else {
        showAuth();
      }
    };

    function showAuth() {
      document.getElementById('authView').classList.remove('hidden');
      document.getElementById('mainView').classList.add('hidden');
    }

    function showApp(email) {
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('mainView').classList.remove('hidden');
      fetchStockData();
    }

    function showAuthError(msg) {
      const status = document.getElementById('authStatus');
      status.className = 'rounded-2xl p-3.5 text-center text-[12px] font-semibold bg-rose-50 text-rose-700 border border-rose-200';
      status.innerText = msg;
      status.classList.remove('hidden');
    }

    async function handleEmailSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const btn = document.getElementById('emailSubmitBtn');
      
      btn.disabled = true;
      btn.innerText = 'Checking...';
      document.getElementById('authStatus').classList.add('hidden');

      try {
        const res = await fetch(`${AUTH_API_URL}?action=checkEmail&email=${encodeURIComponent(email)}`);
        const data = await res.json();

        if (data.success) {
          pendingEmail = email;
          document.getElementById('emailForm').classList.add('hidden');
          document.getElementById('pinForm').classList.remove('hidden');
          document.getElementById('userEmailBadge').innerText = email;

          if (data.hasPin) {
            currentAuthMode = 'login';
            document.getElementById('authTitle').innerText = 'Security PIN';
            document.getElementById('authSubtitle').innerText = 'Enter your 4-6 digit PIN';
            document.getElementById('pinLabel').innerText = 'ENTER PIN';
            document.getElementById('pinSubmitBtn').innerText = 'Sign In';
          } else {
            currentAuthMode = 'setup';
            document.getElementById('authTitle').innerText = 'Create PIN';
            document.getElementById('authSubtitle').innerText = 'Set a 4-6 digit PIN for first-time login';
            document.getElementById('pinLabel').innerText = 'CREATE NEW PIN';
            document.getElementById('pinSubmitBtn').innerText = 'Save & Sign In';
          }
          document.getElementById('pinInput').focus();
        } else {
          showAuthError(data.message || 'Email not authorized to access system.');
        }
      } catch (err) {
        showAuthError('Connection error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Next →';
      }
    }

    async function handlePinSubmit(e) {
      e.preventDefault();
      const pin = document.getElementById('pinInput').value.trim();
      const btn = document.getElementById('pinSubmitBtn');

      if (pin.length < 4) {
        showAuthError('PIN must be at least 4 digits');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Verifying...';
      document.getElementById('authStatus').classList.add('hidden');

      try {
        const action = currentAuthMode === 'setup' ? 'setupPin' : 'auth';
        const res = await fetch(`${AUTH_API_URL}?action=${action}&email=${encodeURIComponent(pendingEmail)}&pin=${encodeURIComponent(pin)}`);
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('seara_user_email', pendingEmail);
          showApp(pendingEmail);
        } else {
          showAuthError(data.message || 'Invalid PIN. Please try again.');
        }
      } catch (err) {
        showAuthError('Connection error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.innerText = currentAuthMode === 'setup' ? 'Save & Sign In' : 'Sign In';
      }
    }

    function backToEmail() {
      document.getElementById('pinForm').classList.add('hidden');
      document.getElementById('emailForm').classList.remove('hidden');
      document.getElementById('authTitle').innerText = 'Sign In';
      document.getElementById('authSubtitle').innerText = 'Enter your work email to continue';
      document.getElementById('authStatus').classList.add('hidden');
      document.getElementById('pinInput').value = '';
    }

    function handleSignOut() {
      if (confirm('คุณต้องการออกจากระบบใช่หรือไม่?')) {
        localStorage.removeItem('seara_user_email');
        location.reload();
      }
    }

    async function fetchStockData(forceRefresh = false) {
      const loader = document.getElementById('loadingIndicator');
      loader.classList.remove('hidden');

      try {
        const fetchUrl = forceRefresh ? `${DATA_URL}?t=${new Date().getTime()}` : `${DATA_URL}?t=${Math.floor(Date.now() / 60000)}`;
        const res = await fetch(fetchUrl);
        if (!res.ok) throw new Error('Failed to load data.json');

        const json = await res.json();
        allItems = json.items || [];
        document.getElementById('syncTimeText').innerText = `Sync: ${json.syncTime || '-'}`;

        updateKpis(allItems);
        populateFilterOptions();
        buildQuickBrandBadges();
        filterAndRender();
      } catch (err) {
        console.error(err);
      } finally {
        loader.classList.add('hidden');
      }
    }

    function updateKpis(items) {
      document.getElementById('kpiTotal').innerText = items.length.toLocaleString();
      const inStockCount = items.filter(x => x.availableInStock > 0).length;
      const orderedCount = items.filter(x => x.ordered > 0).length;
      document.getElementById('kpiInStock').innerText = inStockCount.toLocaleString();
      document.getElementById('kpiOrdered').innerText = orderedCount.toLocaleString();
    }

    function buildQuickBrandBadges() {
      const brandCounts = {};
      allItems.forEach(i => {
        if (i.brand && i.brand !== 'Unbranded') {
          brandCounts[i.brand] = (brandCounts[i.brand] || 0) + 1;
        }
      });

      const topBrands = Object.entries(brandCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8);

      const box = document.getElementById('quickBrandBadges');
      box.innerHTML = '';
      topBrands.forEach(([brand]) => {
        const btn = document.createElement('button');
        btn.className = 'text-[11px] font-bold px-3 py-1 bg-white border border-slate-200 rounded-xl text-slate-600 hover:border-indigo-600 hover:text-indigo-600 active:scale-95 shrink-0 shadow-xs transition';
        btn.innerText = brand;
        btn.onclick = () => {
          document.getElementById('searchInput').value = brand;
          handleSearch(brand);
        };
        box.appendChild(btn);
      });
    }

    function populateFilterOptions() {
      const warehouses = new Set();
      const brands = new Set();

      allItems.forEach(item => {
        if (item.wh) warehouses.add(item.wh);
        if (item.brand) brands.add(item.brand);
      });

      const whSelect = document.getElementById('warehouseFilter');
      whSelect.innerHTML = '<option value="ALL">ทุกคลัง (All Warehouses)</option>';
      Array.from(warehouses).sort().forEach(wh => {
        whSelect.innerHTML += `<option value="${wh}">${wh}</option>`;
      });

      const brandSelect = document.getElementById('brandFilter');
      brandSelect.innerHTML = '<option value="ALL">ทุกแบรนด์ (All Brands)</option>';
      Array.from(brands).sort().forEach(b => {
        brandSelect.innerHTML += `<option value="${b}">${b}</option>`;
      });
    }

    function filterAndRender() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const selWh = document.getElementById('warehouseFilter').value;
      const selBrand = document.getElementById('brandFilter').value;
      const selStatus = document.getElementById('statusFilter').value;

      const filtered = allItems.filter(item => {
        const matchesSearch = !search || 
          item.itemNo.toLowerCase().includes(search) || 
          item.desc.toLowerCase().includes(search) || 
          item.brand.toLowerCase().includes(search);

        const matchesWh = selWh === 'ALL' || item.wh === selWh;
        const matchesBrand = selBrand === 'ALL' || item.brand === selBrand;
        const matchesStatus = selStatus === 'ALL' || item.statusText === selStatus;

        return matchesSearch && matchesWh && matchesBrand && matchesStatus;
      });

      renderItems(filtered);
    }

    function renderItems(items) {
      const container = document.getElementById('itemsContainer');
      const empty = document.getElementById('emptyState');
      const count = document.getElementById('resultCount');

      container.innerHTML = '';
      count.innerText = `พบทั้งหมด ${items.length.toLocaleString()} รายการ`;

      if (items.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      const displayItems = items.slice(0, 150);

      displayItems.forEach((item) => {
        let badgeBg = 'bg-rose-50 text-rose-700 border-rose-200';
        if (item.color === 'green') badgeBg = 'bg-emerald-50 text-emerald-700 border-emerald-200';
        else if (item.color === 'yellow') badgeBg = 'bg-amber-50 text-amber-700 border-amber-200';

        const card = document.createElement('div');
        card.className = 'bg-white border border-slate-200/90 rounded-[24px] p-4.5 shadow-sm hover:shadow-md transition active:scale-[0.99] cursor-pointer flex flex-col justify-between';
        card.onclick = () => openModal(item);
        
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start gap-2">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-[10px] font-black uppercase px-2 py-0.5 bg-slate-100 text-slate-700 rounded-lg tracking-wider">${escapeHtml(item.wh)}</span>
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-tight">${escapeHtml(item.brand)}</span>
              </div>
              <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full border ${badgeBg} shrink-0">
                ${escapeHtml(item.statusText)}
              </span>
            </div>
            <h3 class="text-[15px] font-extrabold text-slate-900 mt-2 tracking-tight">${escapeHtml(item.itemNo)}</h3>
            <p class="text-[12px] text-slate-500 font-medium line-clamp-2 mt-1 leading-snug">${escapeHtml(item.desc)}</p>
          </div>

          <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-slate-100 text-center">
            <div class="bg-emerald-50/60 rounded-xl py-1.5 border border-emerald-100/60">
              <p class="text-[9px] font-extrabold text-emerald-800 uppercase">พร้อมขาย</p>
              <p class="text-[15px] font-black text-emerald-600">${item.availableInStock.toLocaleString()}</p>
            </div>
            <div class="bg-slate-50 rounded-xl py-1.5 border border-slate-100">
              <p class="text-[9px] font-extrabold text-slate-400 uppercase">ในคลัง</p>
              <p class="text-[15px] font-black text-slate-700">${item.inStock.toLocaleString()}</p>
            </div>
            <div class="bg-amber-50/60 rounded-xl py-1.5 border border-amber-100/60">
              <p class="text-[9px] font-extrabold text-amber-800 uppercase">รอเข้า (PO)</p>
              <p class="text-[15px] font-black text-amber-600">${item.ordered.toLocaleString()}</p>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function handleSearch(val) {
      const clearBtn = document.getElementById('clearSearchBtn');
      if (val.trim()) clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');
      filterAndRender();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      filterAndRender();
      input.focus();
    }

    function openModal(item) {
      const content = document.getElementById('modalContent');
      content.innerHTML = `
        <div class="space-y-4">
          <div>
            <div class="flex items-center gap-2 mb-1.5">
              <span class="text-[10px] font-black uppercase px-2.5 py-0.5 bg-indigo-50 text-indigo-700 rounded-md tracking-wider">คลัง: ${escapeHtml(item.wh)}</span>
              <span class="text-[11px] font-bold text-slate-400 uppercase">${escapeHtml(item.brand)}</span>
            </div>
            <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">${escapeHtml(item.itemNo)}</h2>
            <p class="text-[13px] text-slate-600 font-medium mt-1">${escapeHtml(item.desc)}</p>
          </div>

          <div class="grid grid-cols-2 gap-2.5 bg-slate-50 p-4 rounded-2xl border border-slate-100">
            <div class="bg-white p-3 rounded-xl border border-slate-200/70 shadow-xs">
              <p class="text-[10px] font-bold text-slate-400 uppercase">Available (พร้อมขาย)</p>
              <p class="text-2xl font-black text-emerald-600 mt-0.5">${item.availableInStock.toLocaleString()} <span class="text-[11px] font-bold text-slate-400">${escapeHtml(item.unit)}</span></p>
            </div>
            <div class="bg-white p-3 rounded-xl border border-slate-200/70 shadow-xs">
              <p class="text-[10px] font-bold text-slate-400 uppercase">In Stock (สต็อกจริง)</p>
              <p class="text-2xl font-black text-slate-800 mt-0.5">${item.inStock.toLocaleString()} <span class="text-[11px] font-bold text-slate-400">${escapeHtml(item.unit)}</span></p>
            </div>
            <div class="bg-white p-3 rounded-xl border border-slate-200/70 shadow-xs">
              <p class="text-[10px] font-bold text-slate-400 uppercase">Committed (ติดจอง)</p>
              <p class="text-xl font-extrabold text-rose-500 mt-0.5">${item.defined.toLocaleString()} <span class="text-[11px] font-bold text-slate-400">${escapeHtml(item.unit)}</span></p>
            </div>
            <div class="bg-white p-3 rounded-xl border border-slate-200/70 shadow-xs">
              <p class="text-[10px] font-bold text-slate-400 uppercase">On Order (รอส่งมอบ)</p>
              <p class="text-xl font-extrabold text-amber-500 mt-0.5">${item.ordered.toLocaleString()} <span class="text-[11px] font-bold text-slate-400">${escapeHtml(item.unit)}</span></p>
            </div>
          </div>
        </div>
      `;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
