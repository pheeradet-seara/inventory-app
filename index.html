<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SEARA - Inventory App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24">

  <!-- ==================== AUTH VIEW (หน้าล็อกอิน) ==================== -->
  <div id="authView" class="min-h-screen flex items-center justify-center p-4 bg-slate-50">
    <div class="bg-white border border-slate-200/90 rounded-[28px] shadow-2xl p-6 md:p-8 w-full max-w-sm space-y-6">
      <div class="text-center space-y-2">
        <div class="flex justify-center mb-1">
          <img src="./logo.png" alt="SEARA" class="h-14 w-auto object-contain">
        </div>
        <h2 id="authTitle" class="text-xl font-extrabold text-slate-900 tracking-tight">Sign In</h2>
        <p id="authSubtitle" class="text-[12px] text-slate-400 font-medium">Enter your work email to continue</p>
      </div>

      <!-- Step 1: Email Form -->
      <form id="emailForm" onsubmit="handleEmailSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Work Email</label>
          <input type="email" id="emailInput" required placeholder="name@searasports.com" 
                 class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-[14px] font-medium focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition">
        </div>
        <button type="submit" id="emailSubmitBtn" 
                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white rounded-2xl font-bold text-[14px] shadow-lg shadow-indigo-600/30 transition">
          Next →
        </button>
      </form>

      <!-- Step 2: PIN Form -->
      <form id="pinForm" onsubmit="handlePinSubmit(event)" class="space-y-4 hidden">
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label id="pinLabel" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider">Security PIN</label>
            <span id="userEmailBadge" class="text-[11px] text-indigo-600 font-semibold truncate max-w-[180px]"></span>
          </div>
          <input type="password" id="pinInput" maxlength="6" inputmode="numeric" required placeholder="••••" 
                 class="w-full px-4 py-3 rounded-2xl border border-slate-200 text-center text-[22px] tracking-widest font-mono font-bold focus:outline-none focus:ring-2 focus:ring-indigo-600 transition">
        </div>
        <button type="submit" id="pinSubmitBtn" 
                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white rounded-2xl font-bold text-[14px] shadow-lg shadow-indigo-600/30 transition">
          Sign In
        </button>
        <button type="button" onclick="backToEmail()" class="w-full text-center text-[12px] text-slate-400 font-bold hover:text-slate-600 py-1">
          ← Switch Account
        </button>
      </form>

      <!-- Status Message -->
      <div id="authStatus" class="hidden rounded-2xl p-3 text-center text-[12px] font-semibold"></div>
    </div>
  </div>

  <!-- ==================== MAIN INVENTORY VIEW (หน้าสต็อก) ==================== -->
  <div id="mainView" class="hidden">
    
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
      <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <img src="./logo.png" alt="SEARA" class="h-9 w-auto object-contain">
          <div>
            <h1 class="text-[15px] font-extrabold text-slate-900 leading-none">Stock Check</h1>
            <p id="syncTimeText" class="text-[10px] text-slate-400 font-semibold mt-0.5">Sync: -</p>
          </div>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="fetchStockData(true)" title="Sync Data" 
                  class="p-2 text-slate-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition">
            🔄
          </button>
          <button onclick="handleSignOut()" title="Sign Out" 
                  class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-xl transition text-[13px] font-bold">
            🚪
          </button>
        </div>
      </div>

      <!-- Search & Filters -->
      <div class="max-w-5xl mx-auto px-4 pb-3 space-y-2">
        <div class="relative">
          <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Search Part No, Model, Brand..." 
                 class="w-full pl-10 pr-4 py-2.5 bg-slate-100 border-none rounded-2xl text-[13px] font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:bg-white transition">
          <span class="absolute left-3.5 top-2.5 text-slate-400 text-sm">🔍</span>
          <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-2 text-slate-400 hover:text-slate-600 text-sm p-1">✕</button>
        </div>

        <!-- Filter Pills -->
        <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar pt-1">
          <select id="warehouseFilter" onchange="filterAndRender()" 
                  class="bg-slate-100 text-[11px] font-bold text-slate-600 px-3 py-1.5 rounded-xl border-none focus:ring-1 focus:ring-indigo-600 outline-none">
            <option value="ALL">All Warehouses</option>
          </select>
          <select id="brandFilter" onchange="filterAndRender()" 
                  class="bg-slate-100 text-[11px] font-bold text-slate-600 px-3 py-1.5 rounded-xl border-none focus:ring-1 focus:ring-indigo-600 outline-none">
            <option value="ALL">All Brands</option>
          </select>
          <select id="statusFilter" onchange="filterAndRender()" 
                  class="bg-slate-100 text-[11px] font-bold text-slate-600 px-3 py-1.5 rounded-xl border-none focus:ring-1 focus:ring-indigo-600 outline-none">
            <option value="ALL">All Status</option>
            <option value="In Stock">In Stock (>0)</option>
            <option value="Ordered">Ordered</option>
            <option value="Out of Stock">Out of Stock</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-5xl mx-auto p-4">
      <div class="flex justify-between items-center mb-3">
        <span id="resultCount" class="text-[12px] font-bold text-slate-500">Showing 0 items</span>
      </div>

      <!-- Loading Placeholder -->
      <div id="loadingIndicator" class="text-center py-16 space-y-3">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
        <p class="text-[13px] font-bold text-slate-500">Loading stock data...</p>
      </div>

      <!-- Items List -->
      <div id="itemsContainer" class="space-y-3"></div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-16 space-y-2">
        <div class="text-4xl">📦</div>
        <p class="text-[14px] font-bold text-slate-700">No items found</p>
        <p class="text-[12px] text-slate-400">Try adjusting your search or filters</p>
      </div>
    </main>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
    <div class="bg-white rounded-[28px] max-w-md w-full p-6 space-y-4 shadow-2xl relative">
      <button onclick="closeModal()" class="absolute right-4 top-4 text-slate-400 hover:text-slate-600 p-2">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const DATA_URL = "./data.json";
    const SYSTEM_KEY = "INV_SECURE_TOKEN_2026_X9#kL";
    
    // ใส่ URL Google Apps Script ของคุณที่ลงท้ายด้วย /exec ตรงนี้
    const AUTH_API_URL = "https://script.google.com/macros/s/AKfycbwfQ1z41ldFapHtjkgjWjzf2k4MPhORVu0yhnF3QWQJ4dgjtToPnoNHtccmBjVR405O_w/exec"; 

    let allItems = [];
    let currentAuthMode = 'login'; // 'login' or 'setup'
    let pendingEmail = '';

    // ==========================================
    // INITIALIZATION & PWA
    // ==========================================
    window.onload = () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed', err));
      }

      const activeUser = localStorage.getItem('seara_user_email');
      if (activeUser) {
        showApp();
      } else {
        showAuth();
      }
    };

    // ==========================================
    // AUTH LOGIC (GOOGLE APPS SCRIPT)
    // ==========================================
    function showAuth() {
      document.getElementById('authView').classList.remove('hidden');
      document.getElementById('mainView').classList.add('hidden');
    }

    function showApp() {
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('mainView').classList.remove('hidden');
      fetchStockData();
    }

    function showAuthError(msg) {
      const status = document.getElementById('authStatus');
      status.className = 'rounded-2xl p-3 text-center text-[12px] font-semibold bg-red-50 text-red-700 border border-red-200';
      status.innerText = msg;
      status.classList.remove('hidden');
    }

    async function handleEmailSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim().toLowerCase();
      const btn = document.getElementById('emailSubmitBtn');
      
      btn.disabled = true;
      btn.innerText = 'Checking...';
      document.getElementById('authStatus').classList.add('hidden');

      try {
        const res = await fetch(`${AUTH_API_URL}?action=checkEmail&email=${encodeURIComponent(email)}&key=${SYSTEM_KEY}`);
        const data = await res.json();

        if (data.success) {
          pendingEmail = email;
          document.getElementById('emailForm').classList.add('hidden');
          document.getElementById('pinForm').classList.remove('hidden');
          document.getElementById('userEmailBadge').innerText = email;

          if (data.hasPin) {
            currentAuthMode = 'login';
            document.getElementById('authTitle').innerText = 'Security PIN';
            document.getElementById('authSubtitle').innerText = 'Enter your 4-6 digit PIN';
            document.getElementById('pinLabel').innerText = 'ENTER PIN';
            document.getElementById('pinSubmitBtn').innerText = 'Sign In';
          } else {
            currentAuthMode = 'setup';
            document.getElementById('authTitle').innerText = 'Create PIN';
            document.getElementById('authSubtitle').innerText = 'Set a 4-6 digit PIN for first-time login';
            document.getElementById('pinLabel').innerText = 'CREATE NEW PIN';
            document.getElementById('pinSubmitBtn').innerText = 'Save & Sign In';
          }
          document.getElementById('pinInput').focus();
        } else {
          showAuthError(data.message || 'Email not authorized to access system.');
        }
      } catch (err) {
        showAuthError('Connection error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Next →';
      }
    }

    async function handlePinSubmit(e) {
      e.preventDefault();
      const pin = document.getElementById('pinInput').value.trim();
      const btn = document.getElementById('pinSubmitBtn');

      if (pin.length < 4) {
        showAuthError('PIN must be at least 4 digits');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Verifying...';
      document.getElementById('authStatus').classList.add('hidden');

      try {
        const action = currentAuthMode === 'setup' ? 'setupPin' : 'auth';
        const res = await fetch(`${AUTH_API_URL}?action=${action}&email=${encodeURIComponent(pendingEmail)}&pin=${encodeURIComponent(pin)}&key=${SYSTEM_KEY}`);
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('seara_user_email', pendingEmail);
          showApp();
        } else {
          showAuthError(data.message || 'Invalid PIN. Please try again.');
        }
      } catch (err) {
        showAuthError('Connection error. Please try again.');
      } finally {
        btn.disabled = false;
        btn.innerText = currentAuthMode === 'setup' ? 'Save & Sign In' : 'Sign In';
      }
    }

    function backToEmail() {
      document.getElementById('pinForm').classList.add('hidden');
      document.getElementById('emailForm').classList.remove('hidden');
      document.getElementById('authTitle').innerText = 'Sign In';
      document.getElementById('authSubtitle').innerText = 'Enter your work email to continue';
      document.getElementById('authStatus').classList.add('hidden');
      document.getElementById('pinInput').value = '';
    }

    function handleSignOut() {
      if (confirm('Are you sure you want to sign out?')) {
        localStorage.removeItem('seara_user_email');
        location.reload();
      }
    }

    // ==========================================
    // STOCK DATA LOGIC (GITHUB PAGES DATA.JSON)
    // ==========================================
    async function fetchStockData(forceRefresh = false) {
      const loader = document.getElementById('loadingIndicator');
      loader.classList.remove('hidden');

      try {
        const fetchUrl = forceRefresh ? `${DATA_URL}?t=${new Date().getTime()}` : `${DATA_URL}?t=${Math.floor(Date.now() / 60000)}`;
        const res = await fetch(fetchUrl);
        if (!res.ok) throw new Error('Failed to load data.json');

        const json = await res.json();
        allItems = json.items || [];
        document.getElementById('syncTimeText').innerText = `Sync: ${json.syncTime || '-'}`;

        populateFilterOptions();
        filterAndRender();
      } catch (err) {
        alert('Could not load inventory data. Make sure data.json exists.');
        console.error(err);
      } finally {
        loader.classList.add('hidden');
      }
    }

    function populateFilterOptions() {
      const warehouses = new Set();
      const brands = new Set();

      allItems.forEach(item => {
        if (item.wh) warehouses.add(item.wh);
        if (item.brand) brands.add(item.brand);
      });

      const whSelect = document.getElementById('warehouseFilter');
      whSelect.innerHTML = '<option value="ALL">All Warehouses</option>';
      Array.from(warehouses).sort().forEach(wh => {
        whSelect.innerHTML += `<option value="${wh}">${wh}</option>`;
      });

      const brandSelect = document.getElementById('brandFilter');
      brandSelect.innerHTML = '<option value="ALL">All Brands</option>';
      Array.from(brands).sort().forEach(b => {
        brandSelect.innerHTML += `<option value="${b}">${b}</option>`;
      });
    }

    function filterAndRender() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const selWh = document.getElementById('warehouseFilter').value;
      const selBrand = document.getElementById('brandFilter').value;
      const selStatus = document.getElementById('statusFilter').value;

      const filtered = allItems.filter(item => {
        const matchesSearch = !search || 
          item.itemNo.toLowerCase().includes(search) || 
          item.desc.toLowerCase().includes(search) || 
          item.brand.toLowerCase().includes(search);

        const matchesWh = selWh === 'ALL' || item.wh === selWh;
        const matchesBrand = selBrand === 'ALL' || item.brand === selBrand;
        const matchesStatus = selStatus === 'ALL' || item.statusText === selStatus;

        return matchesSearch && matchesWh && matchesBrand && matchesStatus;
      });

      renderItems(filtered);
    }

    function renderItems(items) {
      const container = document.getElementById('itemsContainer');
      const empty = document.getElementById('emptyState');
      const count = document.getElementById('resultCount');

      container.innerHTML = '';
      count.innerText = `Showing ${items.length.toLocaleString()} items`;

      if (items.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      // แสดงรายการสูงสุด 200 รายการเพื่อความเร็วและลื่นไหล
      const displayItems = items.slice(0, 200);

      displayItems.forEach((item, index) => {
        let badgeBg = 'bg-rose-50 text-rose-700 border-rose-200';
        if (item.color === 'green') badgeBg = 'bg-emerald-50 text-emerald-700 border-emerald-200';
        else if (item.color === 'yellow') badgeBg = 'bg-amber-50 text-amber-700 border-amber-200';

        const card = document.createElement('div');
        card.className = 'bg-white border border-slate-200/80 rounded-2xl p-4 shadow-sm hover:shadow-md transition active:scale-[0.99] cursor-pointer';
        card.onclick = () => openModal(item);
        
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-black tracking-wider uppercase px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md">${escapeHtml(item.wh)}</span>
                <span class="text-[11px] font-bold text-slate-400 uppercase">${escapeHtml(item.brand)}</span>
              </div>
              <h3 class="text-[15px] font-black text-slate-900 mt-1">${escapeHtml(item.itemNo)}</h3>
            </div>
            <span class="text-[10px] font-extrabold px-2.5 py-1 rounded-full border ${badgeBg}">
              ${escapeHtml(item.statusText)}
            </span>
          </div>
          <p class="text-[12px] text-slate-500 font-medium line-clamp-1 mt-1">${escapeHtml(item.desc)}</p>
          <div class="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-slate-100 text-center">
            <div>
              <p class="text-[10px] font-bold text-slate-400">Available</p>
              <p class="text-[15px] font-extrabold ${item.availableInStock > 0 ? 'text-emerald-600' : 'text-slate-800'}">${item.availableInStock.toLocaleString()}</p>
            </div>
            <div>
              <p class="text-[10px] font-bold text-slate-400">In Stock</p>
              <p class="text-[15px] font-extrabold text-slate-700">${item.inStock.toLocaleString()}</p>
            </div>
            <div>
              <p class="text-[10px] font-bold text-slate-400">Ordered</p>
              <p class="text-[15px] font-extrabold text-amber-600">${item.ordered.toLocaleString()}</p>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function handleSearch(val) {
      const clearBtn = document.getElementById('clearSearchBtn');
      if (val.trim()) clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');
      filterAndRender();
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      filterAndRender();
      input.focus();
    }

    function openModal(item) {
      const content = document.getElementById('modalContent');
      content.innerHTML = `
        <div class="space-y-4">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="text-[10px] font-black uppercase px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md">${escapeHtml(item.wh)}</span>
              <span class="text-[11px] font-bold text-slate-400 uppercase">${escapeHtml(item.brand)}</span>
            </div>
            <h2 class="text-xl font-extrabold text-slate-900">${escapeHtml(item.itemNo)}</h2>
            <p class="text-[13px] text-slate-600 font-medium mt-1">${escapeHtml(item.desc)}</p>
          </div>

          <div class="grid grid-cols-2 gap-2 bg-slate-50 p-4 rounded-2xl border border-slate-100">
            <div>
              <p class="text-[10px] font-bold text-slate-400">AVAILABLE</p>
              <p class="text-xl font-extrabold text-emerald-600">${item.availableInStock.toLocaleString()} <span class="text-[11px] font-medium text-slate-500">${escapeHtml(item.unit)}</span></p>
            </div>
            <div>
              <p class="text-[10px] font-bold text-slate-400">IN STOCK</p>
              <p class="text-xl font-extrabold text-slate-800">${item.inStock.toLocaleString()} <span class="text-[11px] font-medium text-slate-500">${escapeHtml(item.unit)}</span></p>
            </div>
            <div class="mt-2">
              <p class="text-[10px] font-bold text-slate-400">COMMITTED / RESERVED</p>
              <p class="text-lg font-bold text-rose-500">${item.defined.toLocaleString()}</p>
            </div>
            <div class="mt-2">
              <p class="text-[10px] font-bold text-slate-400">ON ORDER (PO)</p>
              <p class="text-lg font-bold text-amber-500">${item.ordered.toLocaleString()}</p>
            </div>
          </div>
        </div>
      `;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
